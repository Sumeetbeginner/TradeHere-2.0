<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TradeHere</title>

  <script src="https://kit.fontawesome.com/6cc1a5eb9c.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}" />

  <link rel="shortcut icon" href="{{ url_for('static', filename='images/appLogo.png')}}" type="image/x-icon" />
</head>

<body>

  <div id="loginBox">

    <p id="loginTitle">Login</p>

    <div class="form">
      <input id="inpEmail" placeholder="Enter Registered Email" type="text">

      <input id="inpPass" placeholder="Enter Password" type="password">

      <p onclick="resetPassword()" id="fPass1">Forgot Password?</p>

      <button onclick="loginUser()" id="loginBtn">Login</button>

    </div>

    <p class="textCenter">Or</p>

    <a class="anchorTag" href="signup.html"><button id="signupBtn">Create a New Account</button></a>


  </div>

  <script src="https://www.gstatic.com/firebasejs/8.6.7/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.7/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.7/firebase-analytics.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.7/firebase-database.js"></script>

  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>

</html>
