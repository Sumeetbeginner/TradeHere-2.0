<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TradeHere</title>

  <script src="https://kit.fontawesome.com/6cc1a5eb9c.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/signup.css') }}" />

  <link rel="shortcut icon" href="{{ url_for('static', filename='images/appLogo.png')}}" type="image/x-icon" />
</head>

<body>

  <div id="signupBox">

    <p id="signupTitle">Sign Up</p>

    <div class="form">
      <input id="inpName" placeholder="Enter Name" type="text">

      <input id="inpEmail" placeholder="Enter Email" type="text">

      <input id="inpPass" placeholder="Create a Password" type="text">

      <select name="gender" id="inpGender">
        <option value="null">Select Gender</option>
        <option value="Male">Male ♂️</option>
        <option value="Female">Female ♀️</option>
      </select>

      <button onclick="signupUser()" id="signupBtn">Register</button>

    </div>

    <p class="textCenter">Or</p>

    <a class="anchorTag" href="login.html"><button id="loginBtn">Log in to Existing Account</button></a>


  </div>


  <script src="https://www.gstatic.com/firebasejs/8.6.7/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.7/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.7/firebase-analytics.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.7/firebase-database.js"></script>

  <script src="{{ url_for('static', filename='js/signup.js') }}"></script>
</body>

</html>
